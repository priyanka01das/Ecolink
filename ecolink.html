<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoLink - Welcome Back</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#19825b] via-[#157a55] to-[#116747] flex items-center justify-center p-4">

  <div class="w-full max-w-md flex flex-col items-center">
    
    <!-- Top Sprout Badge with White Ring -->
    <div class="w-20 h-20 rounded-full bg-[#65c5a0] border-[4px] border-white shadow-lg flex items-center justify-center mb-5 text-4xl">
      🌱
    </div>

    <!-- Title & Subtitle -->
    <h1 class="text-3xl font-bold text-white tracking-tight text-center mb-1">
      Welcome Back
    </h1>
    <p class="text-white/80 text-sm font-normal text-center mb-7">
      Sign in to access verified biomass marketplace
    </p>

    <!-- White Form Card -->
    <div class="w-full bg-white rounded-[32px] p-8 shadow-2xl">
      <form id="loginForm" onsubmit="event.preventDefault();" class="space-y-4">
        
        <!-- User ID or Email Input -->
        <div class="relative flex items-center">
          <i data-lucide="user" class="w-5 h-5 text-gray-400 absolute left-4 pointer-events-none"></i>
          <input 
            type="text" 
            id="username" 
            placeholder="User ID or Email"
            class="w-full pl-12 pr-4 py-3.5 bg-[#f9fafb] border border-gray-200 rounded-2xl text-gray-800 placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-[#40c090] focus:bg-white transition-all"
            required
          />
        </div>

        <!-- Password Input with Working Show/Hide Eye Toggle -->
        <div class="relative flex items-center">
          <i data-lucide="lock" class="w-5 h-5 text-gray-400 absolute left-4 pointer-events-none"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="Password"
            class="w-full pl-12 pr-12 py-3.5 bg-[#f9fafb] border border-gray-200 rounded-2xl text-gray-800 placeholder-gray-400 text-sm focus:outline-none focus:ring-2 focus:ring-[#40c090] focus:bg-white transition-all"
            required
          />
          <button 
            type="button" 
            id="togglePassword" 
            class="absolute right-4 text-gray-400 hover:text-gray-600 focus:outline-none transition-colors"
          >
            <i data-lucide="eye-off" id="eyeIcon" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Forgot Password Link -->
        <div class="text-right pt-0.5 pb-2">
          <a href="#" class="text-xs text-gray-500 hover:text-emerald-700 font-medium transition-colors">
            Forgot Password?
          </a>
        </div>

        <!-- Primary Button: Login as Waste Seller -->
        <button 
          type="submit" 
          class="w-full py-3.5 bg-[#3ec090] hover:bg-[#34b082] text-white font-semibold rounded-2xl shadow-md hover:shadow-lg active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 text-sm"
        >
          <span>🏭</span> Login as Waste Seller
        </button>

        <!-- Secondary Button: Login as Bio-Energy Recycler -->
        <button 
          type="button" 
          class="w-full py-3.5 bg-[#fcf9eb] hover:bg-[#f5f0d8] text-gray-800 font-medium border border-[#ebe5cc] rounded-2xl active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 text-sm"
        >
          <span class="text-amber-500">⚡</span> Login as Bio-Energy Recycler
        </button>

        <!-- Footer Link -->
        <div class="text-center pt-3 pb-1">
          <p class="text-xs text-gray-500">
            New user? <a href="#" class="text-emerald-700 font-semibold hover:underline">Register here</a>
          </p>
        </div>

      </form>
    </div>

  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toggle Password Visibility
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    let isPasswordVisible = false;

    togglePasswordBtn.addEventListener('click', () => {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? 'text' : 'password';
      
      togglePasswordBtn.innerHTML = isPasswordVisible 
        ? '<i data-lucide="eye" class="w-5 h-5"></i>' 
        : '<i data-lucide="eye-off" class="w-5 h-5"></i>';
      
      lucide.createIcons();
    });
  </script>
</body>
</html>
